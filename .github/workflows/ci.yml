name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref so PR force-pushes don't pile
# up minutes. Stays opt-in for `main` pushes (group on sha).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (placeholder Supabase env)
        # Supabase client construction reads these at module load. The
        # build path doesn't make any network calls, so placeholder
        # values are sufficient to satisfy the URL/format checks.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: npm audit (advisory only)
        # Non-blocking: the README "Known accepted advisories" table
        # documents the postcss moderate finding. Promote to blocking
        # once that's resolved or downgraded upstream.
        run: npm audit --audit-level=high
        continue-on-error: true
